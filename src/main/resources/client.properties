# ownitall's http client, configured the way logging is configured: this file
# lives in ./resources, edit it, rebuild, and every api request follows.
#
# every line is a jersey client property copied straight onto the client
# configuration, so any key jersey or its apache connector understands is a
# valid key here; a key neither recognizes just sits on the configuration
# unused rather than failing startup.
# https://eclipse-ee4j.github.io/jersey.github.io/documentation/latest/client.html

# send every request through a proxy; the username and password lines are
# only needed for a proxy that demands basic auth
#jersey.config.client.proxy.uri=http://proxy.lan:3128
#jersey.config.client.proxy.username=
#jersey.config.client.proxy.password=

# instead of the lines above, honor -Dhttp.proxyHost style jvm properties:
#java.util.Properties' proxy settings then decide, per request
#jersey.config.apache.client.useSystemProperties=true

# socket timeouts in milliseconds
#jersey.config.client.connectTimeout=10000
#jersey.config.client.readTimeout=30000

# how many times a 429 is retried and how many seconds each retry waits
#retries=5
#timeout=20

# minimum milliseconds between requests to one host; neither jersey nor the
# apache connector spaces requests in time, so apis with a request quota
# (musicbrainz counts per second, last.fm answers its limit as a 200 that
# binds to nothing) need the gap spelled out here
pace.musicbrainz.org=1000
pace.ws.audioscrobbler.com=10
pace.openapi.tidal.com=500

# follow 3xx responses or hand them back, and whether the connector keeps a
# cookie store between requests
#jersey.config.client.followRedirects=true
#jersey.config.apache.client.handleCookies=false
